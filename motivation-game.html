<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds of Purpose - Your 2026 Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .header {
            padding: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease;
        }

        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .garden {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, #4a5f3a 0%, #6b8e4e 50%, rgba(107, 142, 78, 0) 100%);
            border-top: 3px solid #3d4f2f;
        }

        .seed-area {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            animation: fadeIn 2s ease;
        }

        .seed-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
            background: radial-gradient(circle, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .seed-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 25px rgba(255,255,255,0.5);
        }

        .seed-btn:active {
            transform: scale(0.95);
        }

        .plant-container {
            position: absolute;
            bottom: 200px;
            transition: all 2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stem {
            width: 8px;
            background: linear-gradient(to top, #2d5016, #4a7c2c);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transform-origin: bottom;
            animation: growStem 2s ease-out forwards;
            border-radius: 4px;
        }

        @keyframes growStem {
            from {
                height: 0;
            }
            to {
                height: 100px;
            }
        }

        .flower {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            animation: bloomFlower 1.5s ease-out 2s forwards;
        }

        @keyframes bloomFlower {
            0% {
                transform: translateX(-50%) scale(0) rotate(0deg);
            }
            50% {
                transform: translateX(-50%) scale(1.2) rotate(10deg);
            }
            100% {
                transform: translateX(-50%) scale(1) rotate(0deg);
            }
        }

        .petal {
            width: 40px;
            height: 60px;
            border-radius: 50% 50% 50% 50%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .center {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffeb3b, #fdd835);
            position: absolute;
            top: 15px;
            left: 5px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
        }

        .affirmation {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            font-weight: bold;
            color: #667eea;
            white-space: nowrap;
            opacity: 0;
            animation: floatUp 4s ease-out 3.5s forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 1.1em;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            20% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateX(-50%) translateY(-20px);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-40px);
            }
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes sparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8em;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            animation: gentlePulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gentlePulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        @keyframes celebrate {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }

        .counter {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 1.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .reset-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 1.2em;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Seeds of Purpose 🌱</h1>
            <p>Plant your intentions for 2026 and watch them bloom</p>
        </div>

        <div class="counter">
            🌸 Gardens: <span id="flowerCount">0</span>
        </div>

        <div class="instructions" id="instructions">
            Click the seeds below to plant your purpose ✨
        </div>

        <div class="seed-area">
            <button class="seed-btn" onclick="plantSeed(this, 1)">🌰</button>
            <button class="seed-btn" onclick="plantSeed(this, 2)">🌱</button>
            <button class="seed-btn" onclick="plantSeed(this, 3)">🌿</button>
        </div>

        <div class="garden"></div>
        <div id="plantArea"></div>

        <button class="reset-btn" onclick="resetGarden()">🔄 Start Fresh Garden</button>
    </div>

    <div class="celebration" id="celebration"></div>

    <script>
        const affirmations = [
            "You are capable of amazing things",
            "Your work has meaning and purpose",
            "You bring unique value to the world",
            "Growth happens one step at a time",
            "You deserve success and joy",
            "Your efforts create positive change",
            "You are exactly where you need to be",
            "Progress, not perfection",
            "You inspire others by being yourself",
            "Your potential is limitless",
            "Small actions lead to big results",
            "You are worthy of your dreams",
            "Trust the process of your journey",
            "You make a difference every day",
            "Your creativity knows no bounds"
        ];

        const flowerColors = [
            ['#ff6b9d', '#ffa8cc', '#ffcce5', '#ff4d94', '#c9184a'],
            ['#a8dadc', '#457b9d', '#1d3557', '#63b8d4', '#89c2d9'],
            ['#ffbe0b', '#fb5607', '#ff006e', '#8338ec', '#3a86ff'],
            ['#06ffa5', '#00d9ff', '#7b2cbf', '#c77dff', '#e0aaff'],
            ['#ff5400', '#ff6d00', '#ff8500', '#ff9100', '#ff9e00']
        ];

        let flowerCount = 0;
        let plantPositions = [];

        // Audio context for sound generation
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        function playTone(frequency, duration, type = 'sine') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playPlantSound() {
            // Magical chime sound
            playTone(523.25, 0.2); // C
            setTimeout(() => playTone(659.25, 0.2), 100); // E
            setTimeout(() => playTone(783.99, 0.3), 200); // G
        }

        function playBloomSound() {
            // Uplifting arpeggio
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((note, index) => {
                setTimeout(() => playTone(note, 0.15, 'triangle'), index * 80);
            });
        }

        function createSparkles(x, y) {
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const colors = ['#ffeb3b', '#ff9800', '#ff5722', '#e91e63', '#9c27b0', '#3f51b5', '#00bcd4'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                particle.style.animation = `sparkle ${0.8 + Math.random() * 0.4}s ease-out forwards`;

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 1200);
            }
        }

        function getRandomPosition() {
            const maxAttempts = 50;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = 10 + Math.random() * 80;
                const minDistance = 120;

                let validPosition = true;
                for (let pos of plantPositions) {
                    if (Math.abs(pos - x) < minDistance / window.innerWidth * 100) {
                        validPosition = false;
                        break;
                    }
                }

                if (validPosition) {
                    plantPositions.push(x);
                    return x;
                }
            }

            const x = 10 + Math.random() * 80;
            plantPositions.push(x);
            return x;
        }

        function plantSeed(button, seedType) {
            // Resume audio context on user interaction
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            playPlantSound();

            const rect = button.getBoundingClientRect();
            createSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);

            const instructions = document.getElementById('instructions');
            instructions.style.opacity = '0';

            flowerCount++;
            document.getElementById('flowerCount').textContent = flowerCount;

            const container = document.createElement('div');
            container.className = 'plant-container';
            container.style.left = getRandomPosition() + '%';

            const stem = document.createElement('div');
            stem.className = 'stem';

            const flower = document.createElement('div');
            flower.className = 'flower';

            const colors = flowerColors[Math.floor(Math.random() * flowerColors.length)];

            for (let i = 0; i < 5; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.background = `radial-gradient(circle, ${colors[i]}, ${colors[(i + 1) % colors.length]})`;
                petal.style.transform = `rotate(${i * 72}deg) translateY(-20px)`;
                petal.style.boxShadow = `0 0 10px ${colors[i]}`;
                flower.appendChild(petal);
            }

            const center = document.createElement('div');
            center.className = 'center';
            flower.appendChild(center);

            const affirmation = document.createElement('div');
            affirmation.className = 'affirmation';
            affirmation.textContent = affirmations[Math.floor(Math.random() * affirmations.length)];

            container.appendChild(stem);
            container.appendChild(flower);
            container.appendChild(affirmation);

            document.getElementById('plantArea').appendChild(container);

            setTimeout(() => {
                playBloomSound();
            }, 2000);

            setTimeout(() => {
                const celebration = document.getElementById('celebration');
                celebration.textContent = '✨🌟💫';
                celebration.style.animation = 'celebrate 1.5s ease-out';
                setTimeout(() => {
                    celebration.style.animation = '';
                }, 1500);
            }, 3500);

            if (flowerCount % 5 === 0) {
                setTimeout(() => {
                    const celebration = document.getElementById('celebration');
                    celebration.textContent = '🎉 Amazing Growth! 🎉';
                    celebration.style.animation = 'celebrate 2s ease-out';
                    setTimeout(() => {
                        celebration.style.animation = '';
                    }, 2000);
                }, 4000);
            }
        }

        function resetGarden() {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            playTone(392, 0.2);
            setTimeout(() => playTone(523.25, 0.3), 150);

            document.getElementById('plantArea').innerHTML = '';
            flowerCount = 0;
            plantPositions = [];
            document.getElementById('flowerCount').textContent = '0';
            document.getElementById('instructions').style.opacity = '0.7';

            const celebration = document.getElementById('celebration');
            celebration.textContent = '🌱 Fresh Start! 🌱';
            celebration.style.animation = 'celebrate 1.5s ease-out';
            setTimeout(() => {
                celebration.style.animation = '';
            }, 1500);
        }

        window.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
